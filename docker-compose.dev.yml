services:
  vaultx-app:
    container_name: vaultx-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: npm run dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
